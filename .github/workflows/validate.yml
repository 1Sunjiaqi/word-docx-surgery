name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate JSON manifests
        run: |
          python -m json.tool plugin.json
          python -m json.tool .codex-plugin/plugin.json
          python -m json.tool .agents/plugins/marketplace.json
      - name: Compile scripts
        run: python -m compileall -q skills/word-docx-surgery/scripts
      - name: Run synthetic self-test
        run: python skills/word-docx-surgery/scripts/selftest.py
